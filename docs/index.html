<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kindmade Dashboard</title>
<style>
:root{
  --green:#173f35;
  --green-2:#2f7d5f;
  --paper:#f6f7f3;
  --line:#dce5dc;
  --text:#1f2933;
  --muted:#64748b;
  --white:#fff;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;
  color:var(--text);
  background:
    linear-gradient(135deg,rgba(23,63,53,.08),rgba(47,125,95,.02) 42%,rgba(240,235,218,.52)),
    var(--paper);
}
.page{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:36px 20px;
}
.shell{
  width:min(960px,100%);
}
header{
  margin-bottom:28px;
}
.eyebrow{
  color:var(--green-2);
  font-size:13px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  margin-bottom:10px;
}
h1{
  color:var(--green);
  font-size:clamp(30px,5vw,54px);
  line-height:1.08;
  margin:0 0 14px;
  letter-spacing:0;
}
.intro{
  max-width:680px;
  margin:0;
  color:#52616b;
  font-size:17px;
  line-height:1.7;
}
.nav-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:18px;
  margin-top:30px;
}
.nav-card{
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  min-height:210px;
  padding:24px;
  color:inherit;
  text-decoration:none;
  background:var(--white);
  border:1px solid var(--line);
  border-radius:8px;
  box-shadow:0 18px 44px rgba(23,63,53,.08);
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
}
.nav-card:hover,
.nav-card:focus-visible{
  transform:translateY(-3px);
  border-color:var(--green-2);
  box-shadow:0 22px 54px rgba(23,63,53,.14);
  outline:none;
}
.icon{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  color:var(--green);
  background:#e8f3ed;
  border-radius:8px;
  margin-bottom:22px;
}
.icon svg{
  width:23px;
  height:23px;
  stroke:currentColor;
  stroke-width:2;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.nav-title{
  margin:0 0 8px;
  color:var(--green);
  font-size:24px;
  line-height:1.25;
}
.nav-copy{
  margin:0;
  color:var(--muted);
  line-height:1.65;
  font-size:15px;
}
.cta{
  display:inline-flex;
  align-items:center;
  gap:8px;
  width:max-content;
  margin-top:28px;
  color:var(--green-2);
  font-weight:700;
  font-size:14px;
}
.cta svg{
  width:17px;
  height:17px;
  stroke:currentColor;
  stroke-width:2;
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
}
footer{
  margin-top:22px;
  color:#758391;
  font-size:13px;
}
@media (max-width:720px){
  .page{place-items:start;padding:28px 18px}
  .nav-grid{grid-template-columns:1fr}
  .nav-card{min-height:190px}
}
</style>
</head>
<body>
<main class="page">
  <div class="shell">
    <header>
      <div class="eyebrow">Kindmade Dashboard</div>
      <h1>善良 Kindmade 行銷與 SEO 工作台</h1>
      <p class="intro">快速切換行銷日曆與網站 SEO 報告，集中查看展會排程、永續論壇機會與網站健康度追蹤。</p>
    </header>

    <section class="nav-grid" aria-label="Dashboard menu">
      <a class="nav-card" href="marketing-schedule.html">
        <div>
          <div class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M8 2v4"/><path d="M16 2v4"/><path d="M3 10h18"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/></svg>
          </div>
          <h2 class="nav-title">Marketing Schedule</h2>
          <p class="nav-copy">查看 2026/09 到 2027/08 的展會、永續論壇與建議行銷行動。</p>
        </div>
        <span class="cta">Open schedule <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></span>
      </a>

      <a class="nav-card" href="seo-report.html">
        <div>
          <div class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-7"/><path d="M18 7h1v1"/></svg>
          </div>
          <h2 class="nav-title">SEO Report</h2>
          <p class="nav-copy">回到原本的 SEO 報告畫面，查看歷史報告、分數、問題統計與修正建議。</p>
        </div>
        <span class="cta">Open report <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></span>
      </a>
    </section>

    <footer>Last updated: 2026-09-14</footer>
  </div>
</main>
</body>
</html>
